{% extends 'base.html' %}
{% block title %}Вход — Мой Органайзер{% endblock %}
{% block content %}
    <div class="card">
        <h1 style="margin-top: 0;"><i class="bi bi-box-arrow-in-right"></i> Вход в личный кабинет</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Войти</button>
        </form>
        <p style="margin-top: 15px; font-size: 14px;">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
{% endblock %}
