{% extends 'base.html' %}

{% block title %}Изменить задачу — Мой Органайзер{% endblock %}

{% block content %}
    <div class="card">
        <h1 style="margin-top: 0; font-size: 22px;"><i class="bi bi-pencil-square"></i> Редактировать задачу</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display: flex; gap: 8px; align-items: center;">
                <button type="submit" class="btn-primary"><i class="bi bi-check2"></i> Сохранить изменения</button>
                <a class="btn" href="{% url 'task_list' %}"><i class="bi bi-x-lg"></i> Отмена</a>
            </div>
        </form>
    </div>
{% endblock %}
